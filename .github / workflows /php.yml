name: Testar PHP

on: [push, workflow_dispatch]

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Verificar sintaxe de todos os arquivos
        run: find . -name "*.php" -exec php -l {} \;

      - name: Executar
        run: php funcionario.php
